<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portraits Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                P
            </div>

            <h1>
                Welcome to Portraits Chat
            </h1>

            <p class="subtitle">
                Your Password should be shared by Da Owener.
            </p>

            <div class="input-group">

                <label for="username">
                    Your name
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                >

            </div>

            <button
                id="loginButton"
                class="login-button"
            >
                Continue
            </button>

            <p
                id="error"
                class="error"
            ></p>

            <div class="footer">
                Portraits Chat • Friends only
            </div>

        </section>

    </main>

    <script src="renderer.js"></script>

</body>

</html>
